name: "Application Deployment Pipeline"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy-app:
    uses: andrewhughes1988/platform-deployment-cicd/.github/workflows/terraform-pipeline.yml@main
    with:
      environment: dev
      working_directory: "."
      backend_config_file: backend/dev.backend.tfvars
      var_file: environments/dev.tfvars

